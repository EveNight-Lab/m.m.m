# Cloud Build 설정 파일 (선택사항)
# gcloud builds submit --config=cloudbuild.yaml . 명령으로 사용 가능

steps:
  # Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/namonsaeng-backend:$COMMIT_SHA', '.']
  
  # 이미지를 Container Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/namonsaeng-backend:$COMMIT_SHA']
  
  # Cloud Run에 배포
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'namonsaeng-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/namonsaeng-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'  # 서울 리전 (필요시 변경)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # 인증 없이 접근 가능 (필요시 제거)

images:
  - 'gcr.io/$PROJECT_ID/namonsaeng-backend:$COMMIT_SHA'

